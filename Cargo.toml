[workspace]
members = [".", "macros"]
resolver = "2"

[package]
name = "rsai"
version = "0.4.0"
authors = ["Constantin Luckenbach <cluckenbach@protonmail.com>"]
edition = "2024"
rust-version = "1.97"
description = "Predictable development for unpredictable Gen-AI models. Let the compiler handle the chaos."
homepage = "https://rsai.dev"
repository = "https://github.com/caluckenbach/rsai"
license = "MIT"
keywords = ["ai", "llm", "openai", "openrouter", "automation"]
categories = ["api-bindings"]


[workspace.dependencies]
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
schemars = "1.2.1"

[dependencies]
rsai-macros = { path = "macros", version = "0.4.0" }
async-trait = "0.1.89"
futures = "0.3.32"
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["json"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt", "time"] }
tracing = "0.1.44"

[dev-dependencies]
dotenv = "0.15.0"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
wiremock = "0.6.5"

[[example]]
name = "function-calling"
path = "examples/function_calling.rs"

[[example]]
name = "gemini"
path = "examples/gemini.rs"

[[example]]
name = "generation-config"
path = "examples/generation_config.rs"

[[example]]
name = "http-config"
path = "examples/http_config.rs"

[[example]]
name = "inspector"
path = "examples/inspector.rs"

[[example]]
name = "openrouter"
path = "examples/openrouter.rs"

[[example]]
name = "structured-generation"
path = "examples/structured_generation.rs"

[[example]]
name = "text-generation"
path = "examples/text_generation.rs"

[[example]]
name = "tool-context"
path = "examples/tool_context.rs"

[[example]]
name = "tracing"
path = "examples/tracing.rs"
